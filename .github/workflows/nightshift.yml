name: Alfie Night Shift (DISABLED 2026-08-02)

# DISABLED. This workflow ran 4x/day with `permissions: contents: write`,
# executed orchestrator.py (the 2026-06-16 Day-1 code, not the nightshift
# pipeline), then ran `git add -A && git commit && git push`.
#
# Audited 2026-08-02: it has NEVER produced a commit -- there is no "Alfie
# Bot" author anywhere in the repo history -- so it was doing nothing useful
# while holding write access to the record on a schedule.
#
# Two reasons it is off rather than left running harmlessly:
#   1. `git add -A` from an unattended bot commits whatever is untracked at
#      that moment, and it can race the Mac's own push.
#   2. reports/chain.jsonl must have exactly ONE writer. Two independent
#      machines appending to a hash chain can fork it, and a forked chain is
#      strictly worse than a missed night: a gap is honest and visible, two
#      conflicting histories destroy the single property this record exists
#      to provide.
#
# Left runnable by hand (workflow_dispatch) rather than deleted, so the file
# and its history stay inspectable. If a cloud-side safety net is wanted
# later, the correct shape is a DETECTOR -- check whether today has a chain
# entry and open an issue if not -- with no write access to the chain.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run-collectors:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt 2>/dev/null || echo "No requirements.txt"
      
      - name: Run orchestrator
        run: timeout 30m python3 orchestrator.py || true
      
      - name: Push results
        run: |
          git config user.name "Alfie Bot"
          git config user.email "bot@alfie.local"
          git add -A
          git commit -m "Nightshift run - $(date)" || echo "Nothing to commit"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
